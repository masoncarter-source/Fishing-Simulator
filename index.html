<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151d19">
<title>Stillwater | First-person fishing</title>
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
</head>
<body>
<main class="game" aria-label="Stillwater fishing simulator">
  <div class="view" id="view">
    <img class="lake" src="assets/lake.webp" alt="Snowy mountains and evergreen forests reflected in an alpine lake">
    <img class="rod" id="rod" src="assets/rod.webp" alt="">
    <canvas id="surface" aria-hidden="true"></canvas>
  </div>
  <header>
    <div><div class="brand">Stillwater</div><div class="subtitle">Fishing simulator</div></div>
    <div class="tools"><button id="sound" type="button" aria-pressed="false">Sound off</button><button id="journal" type="button">Catch log <span id="total">0</span></button></div>
  </header>
  <div class="location"><span>Greater Yellowstone</span><strong>Pine Ridge Lake</strong></div>
  <section class="controls" aria-label="Fishing controls">
    <div aria-live="polite" class="message">
      <h1 id="status">Cast into the shallows</h1>
      <p id="hint">Choose a spot on the water or cast straight ahead.</p>
    </div>
    <div id="meters" hidden>
      <div><label for="distance">Reel progress</label><progress id="distance" max="1" value="0"></progress></div>
      <div><label for="tension">Line tension</label><meter id="tension" max="1" low=".62" high=".85" optimum=".3" value="0"></meter></div>
    </div>
    <button type="button" id="action">Cast line</button>
    <div class="keyboard"><kbd>Space</kbd> <span id="shortcut">to cast</span></div>
  </section>
</main>
<dialog id="log">
  <h2>Catch log</h2>
  <p id="summary">Your first catch will appear here.</p>
  <ul id="species"></ul>
  <form method="dialog"><button type="submit">Back to the lake</button></form>
</dialog>
</body>
</html>
